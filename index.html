<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spirit Pocket RPG - Beta 1.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@discord/embedded-app-sdk@1.0.0/dist/umd/index.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      outline: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      -webkit-user-drag: none !important;
      -webkit-tap-highlight-color: transparent !important;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      background: #06080e;
      font-family: 'Kanit', sans-serif;
      color: #fff;
      position: fixed;
      inset: 0;
    }

    /* Fullscreen Canvas */
    #gameViewport {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #090d16;
      cursor: crosshair;
      touch-action: none;
    }
  </style>
</head>
<body>

  <canvas id="gameViewport"></canvas>

  <script>
    // =========================================================================
    // 1. DISCORD SDK & FULLSCREEN VIEWPORT ENGINE (1550x750 VIRTUAL RESOLUTION)
    // =========================================================================
    (async function initDiscord() {
      try {
        const NS = window.DiscordSDK || window.discordSdk;
        const Ctor = NS && (NS.DiscordSDK || NS);
        if (typeof Ctor === "function") {
          const sdk = new Ctor("1561819450917916842");
          await sdk.ready();
        }
      } catch (e) {}
    })();

    const canvas = document.getElementById("gameViewport");
    const ctx = canvas.getContext("2d");

    // Virtual Resolution ล็อกสัดส่วน 1550 x 750 แนวนอน แต่ขยายเต็มจอดิสคอร์ด 100%
    const V_WIDTH = 1550;
    const V_HEIGHT = 750;
    let scaleX = 1, scaleY = 1, offsetX = 0, offsetY = 0, renderScale = 1;

    function resizeViewport() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const ratioW = canvas.width / V_WIDTH;
      const ratioH = canvas.height / V_HEIGHT;
      renderScale = Math.max(ratioW, ratioH); // Cover 100% of screen (Full Bleed)
      // ใช้ Fit สำหรับ UI ไม่ให้ตกขอบแต่พื้นหลังเต็มจอ
      scaleX = Math.min(ratioW, ratioH);
      offsetX = (canvas.width - V_WIDTH * scaleX) / 2;
      offsetY = (canvas.height - V_HEIGHT * scaleX) / 2;
    }
    window.addEventListener("resize", resizeViewport);
    resizeViewport();

    // =========================================================================
    // 2. DEEP RPG DATABASE: MOVES, BUFFS, STATUS, EVOLUTION & MONSTERS
    // =========================================================================
    const TYPE_CHART = {
      Fire:     { Grass: 1.6, Ice: 1.6, Water: 0.6, Fire: 0.7, Rock: 0.6 },
      Water:    { Fire: 1.6, Rock: 1.6, Grass: 0.6, Water: 0.7, Electric: 0.7 },
      Grass:    { Water: 1.6, Rock: 1.6, Fire: 0.6, Grass: 0.7 },
      Electric: { Water: 1.6, Grass: 0.7, Rock: 0.5 },
      Rock:     { Fire: 1.6, Electric: 1.5, Grass: 0.7, Water: 0.7 },
      Dragon:   { Dragon: 1.6 }
    };

    const MOVES_DB = {
      tackle:      { name: "พุ่งชน (Tackle)", type: "Normal", pwr: 40, acc: 100, cat: "phys", desc: "พุ่งชนศัตรูด้วยความเร็ว" },
      swordsDance: { name: "รำดาบ (War Cry)", type: "Normal", pwr: 0, acc: 100, cat: "buff", stat: "atk", val: 1, desc: "บัฟพลังโจมตีเพิ่มขึ้น +50%" },
      ironDef:     { name: "เกราะเหล็ก (Iron Wall)", type: "Rock", pwr: 0, acc: 100, cat: "buff", stat: "def", val: 1, desc: "บัฟพลังป้องกันเพิ่มขึ้น +50%" },
      ember:       { name: "ลูกไฟเวท (Ember)", type: "Fire", pwr: 55, acc: 100, cat: "elem", status: "BRN", chance: 0.3, desc: "ยิงลูกไฟ มีโอกาสติดไฟไหม้ (BRN)" },
      flameBurst:  { name: "ระเบิดโลกันตร์ (Inferno)", type: "Fire", pwr: 90, acc: 90, cat: "elem", status: "BRN", chance: 0.5, desc: "เปลวเพลิงแรงสูง โอกาสเผาไหม้ 50%" },
      vineWhip:    { name: "แส้เถาวัลย์ (Vine Whip)", type: "Grass", pwr: 55, acc: 100, cat: "elem", desc: "ฟาดด้วยเถาวัลย์ธาตุพืช" },
      megaDrain:   { name: "ดูดซับพลัง (Giga Drain)", type: "Grass", pwr: 65, acc: 100, cat: "drain", desc: "โจมตีและฟื้นฟู HP 50% ของดาเมจ" },
      poisonPowder:{ name: "ผงพิษ (Toxic Spore)", type: "Grass", pwr: 20, acc: 95, cat: "elem", status: "PSN", chance: 0.85, desc: "ทำให้ศัตรูติดพิษ (PSN) ลดเลือดทุกเทิร์น" },
      waterGun:    { name: "ปืนฉีดน้ำ (Aqua Jet)", type: "Water", pwr: 55, acc: 100, cat: "elem", desc: "ยิงกระสุนน้ำความเร็วสูง" },
      hydroPump:   { name: "คลื่นยักษ์ (Hydro Vortex)", type: "Water", pwr: 95, acc: 88, cat: "elem", desc: "คลื่นน้ำมหาศาลโจมตีรุนแรง" },
      thunderWave: { name: "ช็อตไฟฟ้า (Volt Shock)", type: "Electric", pwr: 60, acc: 100, cat: "elem", status: "PAR", chance: 0.45, desc: "ช็อตไฟฟ้า มีโอกาสติดอัมพาต (PAR)" },
      rockSlide:   { name: "ถล่มหินผา (Rock Slide)", type: "Rock", pwr: 75, acc: 92, cat: "elem", desc: "ทุ่มหินยักษ์ใส่เป้าหมาย" },
      dragonBreath:{ name: "ลมหายใจมังกร (Draco Breath)", type: "Dragon", pwr: 95, acc: 95, cat: "elem", status: "PAR", chance: 0.35, desc: "ปราณมังกรโบราณทำลายล้างสูง" }
    };

    const MONSTER_DEX = [
      { id: 1, name: "Sproutling", icon: "🌱", color: "#22c55e", type: "Grass", hp: 95, atk: 48, def: 45, spd: 50, moves: ["tackle", "vineWhip", "poisonPowder", "megaDrain"], evolveLv: 6, evolveTo: 2 },
      { id: 2, name: "Sylvanstag", icon: "🦌", color: "#15803d", type: "Grass", hp: 145, atk: 78, def: 70, spd: 75, moves: ["vineWhip", "megaDrain", "swordsDance", "poisonPowder"], evolveLv: 99 },
      { id: 3, name: "Pyrofox", icon: "🦊", color: "#ef4444", type: "Fire", hp: 90, atk: 58, def: 42, spd: 65, moves: ["tackle", "ember", "swordsDance", "flameBurst"], evolveLv: 6, evolveTo: 4 },
      { id: 4, name: "Igniswolf", icon: "🐺", color: "#b91c1c", type: "Fire", hp: 140, atk: 92, def: 65, spd: 88, moves: ["ember", "flameBurst", "swordsDance", "tackle"], evolveLv: 99 },
      { id: 5, name: "Aquashell", icon: "🐢", color: "#38bdf8", type: "Water", hp: 105, atk: 46, def: 62, spd: 42, moves: ["tackle", "waterGun", "ironDef", "hydroPump"], evolveLv: 6, evolveTo: 6 },
      { id: 6, name: "Tidaldrake", icon: "🐊", color: "#0369a1", type: "Water", hp: 160, atk: 82, def: 88, spd: 65, moves: ["waterGun", "hydroPump", "ironDef", "rockSlide"], evolveLv: 99 },
      { id: 7, name: "Voltchu", icon: "⚡", color: "#facc15", type: "Electric", hp: 85, atk: 65, def: 40, spd: 95, moves: ["tackle", "thunderWave", "swordsDance", "ember"], evolveLv: 99 },
      { id: 8, name: "Golemcrag", icon: "🗿", color: "#a8a29e", type: "Rock", hp: 150, atk: 75, def: 95, spd: 35, moves: ["tackle", "rockSlide", "ironDef", "swordsDance"], evolveLv: 99 },
      { id: 9, name: "AetherDragon", icon: "🐉", color: "#c084fc", type: "Dragon", hp: 210, atk: 110, def: 95, spd: 95, moves: ["dragonBreath", "flameBurst", "hydroPump", "swordsDance"], evolveLv: 99 }
    ];

    function createMonsterInstance(dexId, level) {
      const base = MONSTER_DEX.find(m => m.id === dexId) || MONSTER_DEX[0];
      const mult = 1 + (level - 1) * 0.14;
      const maxHp = Math.round(base.hp * mult);
      return {
        uid: Math.random().toString(36).slice(2),
        dexId: base.id,
        name: base.name,
        icon: base.icon,
        color: base.color,
        type: base.type,
        level: level,
        exp: 0,
        nextExp: level * 40,
        maxHp: maxHp,
        hp: maxHp,
        atk: Math.round(base.atk * mult),
        def: Math.round(base.def * mult),
        spd: Math.round(base.spd * mult),
        moves: [...base.moves],
        status: null, // BRN, PSN, PAR
        atkStage: 0,
        defStage: 0
      };
    }

    // =========================================================================
    // 3. WORLD MAP ARCHITECTURE (60x40 TILES = 3000x2000 PX WITH TOWN & ROUTES)
    // =========================================================================
    const MAP_COLS = 60;
    const MAP_ROWS = 40;
    const TILE = 52;

    // Tile Legend:
    // 0: Meadow Grass, 1: Tall Grass (Forest), 2: Dirt Road, 3: Tree (Solid),
    // 4: Water (Solid), 5: Town Brick Pavement, 6: Building Wall (Solid),
    // 7: Roof Red (PokeCenter), 8: Roof Blue (PokeMart), 9: Roof Gold (Gym),
    // 10: Door / Warp Trigger, 11: Volcano Ground, 12: Lava Tall Patch (Encounter),
    // 13: Ice/Lake Ground, 14: Crystal Tall Patch (Encounter), 15: Bridge, 16: Flower
    const worldMap = [];
    for (let r = 0; r < MAP_ROWS; r++) {
      const row = [];
      for (let c = 0; c < MAP_COLS; c++) {
        // Outer Border Trees
        if (r === 0 || r === MAP_ROWS - 1 || c === 0 || c === MAP_COLS - 1) {
          row.push(3);
          continue;
        }
        // ZONE 1: SUNLEAF TOWN (Cols 1-18, Rows 1-20)
        if (c <= 18 && r <= 20) {
          if (c >= 4 && c <= 15 && r >= 5 && r <= 16) row.push(5); // Town Plaza
          else row.push(0);
        }
        // ZONE 2: ROUTE 1 FOREST (Cols 1-24, Rows 21-38)
        else if (c <= 24) {
          row.push(0);
        }
        // RIVER DIVIDER (Cols 25-27)
        else if (c >= 25 && c <= 27) {
          if (r >= 17 && r <= 19) row.push(15); // Wooden Bridge
          else row.push(4);
        }
        // ZONE 3: CINDER VOLCANO (Cols 28-43)
        else if (c <= 43) {
          row.push(11);
        }
        // ZONE 4: AZURE SANCTUARY (Cols 44-58)
        else {
          row.push(13);
        }
      }
      worldMap.push(row);
    }

    // Stamp Buildings in Sunleaf Town
    function buildStructure(x, y, w, h, roofType) {
      for (let r = y; r < y + h; r++) {
        for (let c = x; c < x + w; c++) {
          if (r === y) worldMap[r][c] = roofType;
          else worldMap[r][c] = 6;
        }
      }
      worldMap[y + h - 1][x + Math.floor(w / 2)] = 10; // Door
    }
    buildStructure(5, 4, 4, 3, 7);  // PokéCenter (Door at x:7, y:6)
    buildStructure(11, 4, 4, 3, 8); // PokéMart (Door at x:13, y:6)
    buildStructure(8, 12, 5, 3, 9); // Town Gym (Door at x:10, y:14)

    // Stamp Encounter Patches & Trees
    for (let r = 22; r <= 35; r++) {
      for (let c = 4; c <= 21; c++) {
        if ((r + c) % 7 === 0) worldMap[r][c] = 3;
        else if (c >= 6 && c <= 19 && r >= 24 && r <= 33) worldMap[r][c] = 1;
      }
    }
    for (let r = 6; r <= 33; r++) {
      for (let c = 30; c <= 41; c++) {
        if ((r * c) % 13 === 0) worldMap[r][c] = 3;
        else if (c >= 32 && c <= 39 && r >= 10 && r <= 28) worldMap[r][c] = 12;
      }
    }
    for (let r = 6; r <= 33; r++) {
      for (let c = 46; c <= 56; c++) {
        if ((r + c) % 9 === 0) worldMap[r][c] = 4;
        else if (c >= 48 && c <= 55 && r >= 10 && r <= 28) worldMap[r][c] = 14;
      }
    }

    // Interactive NPCs & Bosses on Map
    const NPCS = [
      { id: "nurse", name: "พยาบาล Joy", x: 7, y: 7, color: "#f472b6", hat: "#fff", role: "HEALER",
        dialog: "ยินดีต้อนรับสู่ PokéCenter! ฉันได้ฟื้นฟู HP และรักษาสถานะผิดปกติให้มอนสเตอร์ทุกตัวในทีมของคุณเรียบร้อยแล้วค่ะ!" },
      { id: "mart", name: "พ่อค้า PokéMart", x: 13, y: 7, color: "#38bdf8", hat: "#0284c7", role: "SHOP",
        dialog: "เชิญเลือกซื้อ Spirit Ball, ยาฟื้นพลัง และไอเทมพัฒนาการได้เลยครับ!" },
      { id: "guide", name: "ลุงผู้เฒ่า Oak", x: 9, y: 9, color: "#a3e635", hat: "#4d7c0f", role: "TALK",
        dialog: "เคล็ดลับเทรนเนอร์: ลองเดินลงไปที่ป่าทางใต้เพื่อจับมอนสเตอร์และเก็บเลเวล ถ้าเลเวลถึง Lv.6 มอนสเตอร์จะพัฒนาร่างได้!" },
      { id: "scout", name: "เทรนเนอร์ Bugsy", x: 14, y: 23, color: "#fbbf24", hat: "#b45309", role: "TRAINER",
        defeated: false, reward: 120, enemyDex: 1, enemyLv: 3,
        dialog: "สายตาเราประสานกันแล้ว! มาประลองมอนสเตอร์กันเดี๋ยวนี้!" },
      { id: "pyro_npc", name: "นักสู้เพลิง Blaze", x: 31, y: 18, color: "#f87171", hat: "#991b1b", role: "TRAINER",
        defeated: false, reward: 220, enemyDex: 4, enemyLv: 6,
        dialog: "ข้ามสะพานมาสู่หุบเขาลาวาได้ แปลว่าฝีมือไม่ธรรมดา มาดวลกัน!" },
      { id: "gym_leader", name: "แชมเปี้ยนยิม Lance", x: 10, y: 15, color: "#c084fc", hat: "#6b21a8", role: "TRAINER",
        defeated: false, reward: 500, enemyDex: 9, enemyLv: 9,
        dialog: "ข้าคือแชมเปี้ยนประจำเมือง Sunleaf! จงแสดงพลังสายสัมพันธ์ของเจ้ากับมอนสเตอร์ออกมา!" }
    ];

    // =========================================================================
    // 4. PLAYER & GAME STATE
    // =========================================================================
    let gameState = "OVERWORLD"; // OVERWORLD, DIALOG, BATTLE, SHOP, PARTY, DEX
    let gold = 250;
    let inventory = { ball1: 6, ball2: 2, ball3: 1, potion: 4, superPotion: 1 };
    let badges = 0;

    let party = [
      createMonsterInstance(3, 3), // Starter Pyrofox Lv.3
      createMonsterInstance(1, 2)  // Partner Sproutling Lv.2
    ];
    let discoveredDex = new Set([1, 3]);

    const player = {
      x: 9,
      y: 8,
      px: 9 * TILE,
      py: 8 * TILE,
      tx: 9 * TILE,
      ty: 8 * TILE,
      dir: "DOWN",
      frame: 0,
      prevX: 9,
      prevY: 7,
      compPx: 9 * TILE,
      compPy: 7 * TILE,
      pathQueue: []
    };

    // Active Dialog & Notification State
    let dialogState = { title: "", text: "", onFinish: null };
    let toasts = [];
    function pushToast(text, color = "#38bdf8") {
      toasts.push({ text, color, timer: 160 });
    }

    // Active Battle State
    let battle = null;

    // =========================================================================
    // 5. OVERWORLD MOVEMENT & COLLISION
    // =========================================================================
    function isSolidTile(c, r) {
      if (c < 0 || c >= MAP_COLS || r < 0 || r >= MAP_ROWS) return true;
      const t = worldMap[r][c];
      if ([3, 4, 6, 7, 8, 9].includes(t)) return true;
      if (NPCS.some(n => n.x === c && n.y === r)) return true;
      return false;
    }

    function stepPlayer(dir) {
      if (gameState !== "OVERWORLD") return;
      player.dir = dir;
      player.frame = (player.frame + 1) % 2;

      let nx = player.x;
      let ny = player.y;
      if (dir === "UP") ny--;
      if (dir === "DOWN") ny++;
      if (dir === "LEFT") nx--;
      if (dir === "RIGHT") nx++;

      // Check NPC Interaction directly in front
      const npc = NPCS.find(n => n.x === nx && n.y === ny);
      if (npc) {
        interactWithNPC(npc);
        player.pathQueue = [];
        return;
      }

      // Check Building Doors
      if (worldMap[ny] && worldMap[ny][nx] === 10) {
        if (nx === 7) interactWithNPC(NPCS[0]);
        else if (nx === 13) interactWithNPC(NPCS[1]);
        else if (nx === 10) interactWithNPC(NPCS[5]);
        player.pathQueue = [];
        return;
      }

      if (isSolidTile(nx, ny)) {
        player.pathQueue = [];
        return;
      }

      player.prevX = player.x;
      player.prevY = player.y;
      player.x = nx;
      player.y = ny;
      player.tx = nx * TILE;
      player.ty = ny * TILE;

      // Check Wild Tall Grass Encounter
      const tile = worldMap[ny][nx];
      if ([1, 12, 14].includes(tile) && Math.random() < 0.24) {
        player.pathQueue = [];
        startWildBattle(tile);
      }
    }

    function interactFacingTile() {
      if (gameState === "DIALOG") {
        const cb = dialogState.onFinish;
        gameState = "OVERWORLD";
        if (cb) cb();
        return;
      }
      if (gameState !== "OVERWORLD") return;

      let fx = player.x;
      let fy = player.y;
      if (player.dir === "UP") fy--;
      if (player.dir === "DOWN") fy++;
      if (player.dir === "LEFT") fx--;
      if (player.dir === "RIGHT") fx++;

      const npc = NPCS.find(n => n.x === fx && n.y === fy);
      if (npc) interactWithNPC(npc);
    }

    function interactWithNPC(npc) {
      if (npc.role === "HEALER") {
        party.forEach(p => { p.hp = p.maxHp; p.status = null; });
        pushToast("💖 ฟื้นฟูทีมเต็ม 100%!", "#10b981");
        openDialog(npc.name, npc.dialog);
      } else if (npc.role === "SHOP") {
        openDialog(npc.name, npc.dialog, () => { gameState = "SHOP"; });
      } else if (npc.role === "TRAINER") {
        openDialog(npc.name, npc.dialog, () => {
          startTrainerBattle(npc);
        });
      } else {
        openDialog(npc.name, npc.dialog);
      }
    }

    function openDialog(title, text, onFinish = null) {
      gameState = "DIALOG";
      dialogState = { title, text, onFinish };
    }

    // =========================================================================
    // 6. BATTLE ENGINE (MOVES, BUFFS, STATUS, CATCH & EVOLUTION)
    // =========================================================================
    function startWildBattle(tileType) {
      let pool = [1, 3, 5, 7];
      let minLv = 2, maxLv = 4;
      if (tileType === 12) { pool = [3, 4, 8]; minLv = 4; maxLv = 7; }
      if (tileType === 14) { pool = [5, 6, 9]; minLv = 6; maxLv = 9; }

      const dexId = pool[Math.floor(Math.random() * pool.length)];
      const lv = Math.floor(Math.random() * (maxLv - minLv + 1)) + minLv;
      const enemy = createMonsterInstance(dexId, lv);
      discoveredDex.add(dexId);

      initBattleState(enemy, true, null);
    }

    function startTrainerBattle(npc) {
      const enemy = createMonsterInstance(npc.enemyDex, npc.enemyLv);
      discoveredDex.add(npc.enemyDex);
      initBattleState(enemy, false, npc);
    }

    function initBattleState(enemy, isWild, npcRef) {
      // Find first alive party member
      let leadIdx = party.findIndex(p => p.hp > 0);
      if (leadIdx === -1) {
        party[0].hp = party[0].maxHp;
        leadIdx = 0;
      }
      party.forEach(p => { p.atkStage = 0; p.defStage = 0; });

      battle = {
        isWild,
        npcRef,
        enemy,
        playerIdx: leadIdx,
        menuTab: "MAIN", // MAIN, MOVES, BAG, PARTY
        log: isWild ? `⚠️ มอนสเตอร์ป่า ${enemy.name} (Lv.${enemy.level}) ปรากฏตัว!` : `⚔️ ${npcRef.name} ส่ง ${enemy.name} (Lv.${enemy.level}) ออกมา!`,
        busy: false,
        ballAnim: null
      };
      gameState = "BATTLE";
    }

    function executePlayerMove(moveKey) {
      if (!battle || battle.busy) return;
      const pMon = party[battle.playerIdx];
      const eMon = battle.enemy;
      const move = MOVES_DB[moveKey];
      battle.busy = true;
      battle.menuTab = "MAIN";

      // Check Paralysis
      if (pMon.status === "PAR" && Math.random() < 0.25) {
        battle.log = `⚡ ${pMon.name} ติดอาการชา (PAR) ขยับตัวไม่ได้!`;
        setTimeout(() => runEnemyTurn(), 1100);
        return;
      }

      if (move.cat === "buff") {
        if (move.stat === "atk") pMon.atkStage = Math.min(3, pMon.atkStage + 1);
        if (move.stat === "def") pMon.defStage = Math.min(3, pMon.defStage + 1);
        battle.log = `🔼 ${pMon.name} ใช้ ${move.name}! ${move.desc}`;
        setTimeout(() => runEnemyTurn(), 1100);
        return;
      }

      // Calculate Damage
      const atkMult = 1 + pMon.atkStage * 0.35 - (pMon.status === "BRN" ? 0.25 : 0);
      const defMult = 1 + eMon.defStage * 0.35;
      const typeEff = (TYPE_CHART[move.type] && TYPE_CHART[move.type][eMon.type]) || 1.0;
      const rawDmg = ((pMon.atk * atkMult * move.pwr) / (eMon.def * defMult * 1.4)) * typeEff;
      const dmg = Math.max(6, Math.round(rawDmg * (0.9 + Math.random() * 0.2)));

      eMon.hp = Math.max(0, eMon.hp - dmg);
      let effMsg = typeEff > 1.2 ? " (ได้ผลดีเยี่ยม! 🔥)" : (typeEff < 0.8 ? " (ได้ผลไม่ค่อยดี...)" : "");
      battle.log = `💥 ${pMon.name} ใช้ ${move.name}! ทำดาเมจ ${dmg} HP${effMsg}`;

      if (move.cat === "drain") {
        const heal = Math.round(dmg * 0.5);
        pMon.hp = Math.min(pMon.maxHp, pMon.hp + heal);
        battle.log += ` (ดูดซับ +${heal} HP)`;
      }

      if (move.status && !eMon.status && Math.random() < move.chance && eMon.hp > 0) {
        eMon.status = move.status;
        battle.log += ` | ศัตรูติดสถานะ [${move.status}]!`;
      }

      setTimeout(() => {
        if (eMon.hp <= 0) {
          handleBattleVictory();
        } else {
          runEnemyTurn();
        }
      }, 1150);
    }

    function runEnemyTurn() {
      if (!battle) return;
      const pMon = party[battle.playerIdx];
      const eMon = battle.enemy;

      // Apply Status Dot on Enemy
      if (eMon.status === "BRN" || eMon.status === "PSN") {
        const dot = Math.max(5, Math.round(eMon.maxHp * 0.1));
        eMon.hp = Math.max(0, eMon.hp - dot);
        if (eMon.hp <= 0) {
          battle.log = `☠️ ${eMon.name} พ่ายแพ้จากพิษ/ไฟไหม้!`;
          setTimeout(() => handleBattleVictory(), 900);
          return;
        }
      }

      const moveKey = eMon.moves[Math.floor(Math.random() * eMon.moves.length)];
      const move = MOVES_DB[moveKey] || MOVES_DB.tackle;

      if (move.cat === "buff") {
        eMon.atkStage = Math.min(3, eMon.atkStage + 1);
        battle.log = `⚠️ ศัตรู ${eMon.name} ใช้ ${move.name} เพิ่มพลังโจมตี!`;
        battle.busy = false;
        return;
      }

      const atkMult = 1 + eMon.atkStage * 0.35;
      const defMult = 1 + pMon.defStage * 0.35;
      const typeEff = (TYPE_CHART[move.type] && TYPE_CHART[move.type][pMon.type]) || 1.0;
      const dmg = Math.max(5, Math.round(((eMon.atk * atkMult * move.pwr) / (pMon.def * defMult * 1.55)) * typeEff));

      pMon.hp = Math.max(0, pMon.hp - dmg);
      battle.log = `⚡ ศัตรู ${eMon.name} โจมตีด้วย ${move.name} สร้างความเสียหาย ${dmg} HP!`;

      setTimeout(() => {
        if (pMon.hp <= 0) {
          const nextAlive = party.findIndex(p => p.hp > 0);
          if (nextAlive !== -1) {
            battle.playerIdx = nextAlive;
            battle.log = `💫 ส่ง ${party[nextAlive].name} ลงสนามแทน!`;
            battle.busy = false;
          } else {
            // Blackout -> Warp to PokeCenter
            party.forEach(p => { p.hp = p.maxHp; p.status = null; });
            player.x = 7; player.y = 8; player.px = 7 * TILE; player.py = 8 * TILE; player.tx = 7 * TILE; player.ty = 8 * TILE;
            gameState = "OVERWORLD";
            pushToast("🏥 ทีมหมดสติ! พยาบาล Joy ช่วยส่งกลับมารักษาที่เมือง", "#ef4444");
          }
        } else {
          battle.busy = false;
        }
      }, 1000);
    }

    function useBattleItem(itemKey) {
      if (!battle || battle.busy) return;
      const pMon = party[battle.playerIdx];
      const eMon = battle.enemy;

      if (itemKey === "potion" || itemKey === "superPotion") {
        if (inventory[itemKey] <= 0) { pushToast("❌ ไอเทมหมด!", "#ef4444"); return; }
        inventory[itemKey]--;
        const heal = itemKey === "potion" ? 65 : 150;
        pMon.hp = Math.min(pMon.maxHp, pMon.hp + heal);
        pMon.status = null;
        battle.menuTab = "MAIN";
        battle.busy = true;
        battle.log = `🧪 ฟื้นฟู +${heal} HP และรักษาสถานะให้ ${pMon.name}!`;
        setTimeout(() => runEnemyTurn(), 1000);
        return;
      }

      // Throw Pokeball
      if (!battle.isWild) {
        pushToast("🚫 ไม่สามารถขโมยมอนสเตอร์ของเทรนเนอร์คนอื่นได้!", "#ef4444");
        return;
      }
      if (inventory[itemKey] <= 0) {
        pushToast("❌ ลูกบอลชนิดนี้หมด! ซื้อเพิ่มที่ PokéMart", "#ef4444");
        return;
      }

      inventory[itemKey]--;
      battle.menuTab = "MAIN";
      battle.busy = true;
      const mult = itemKey === "ball1" ? 1.0 : (itemKey === "ball2" ? 1.7 : 999);
      const hpFactor = (1 - (eMon.hp / eMon.maxHp) * 0.75);
      const statusBonus = eMon.status ? 0.2 : 0;
      const chance = (0.45 * hpFactor + statusBonus) * mult;

      battle.ballAnim = { step: 0 };
      battle.log = `🔴 ปาบอลจับ ${eMon.name}... (บอลกำลังสั่น 1... 2... 3...)`;

      setTimeout(() => {
        if (Math.random() < chance) {
          battle.ballAnim = null;
          party.push({ ...eMon, hp: eMon.maxHp, status: null });
          discoveredDex.add(eMon.dexId);
          gold += 35;
          pushToast(`🎉 จับ ${eMon.name} (Lv.${eMon.level}) สำเร็จ! (+35G)`, "#10b981");
          gameState = "OVERWORLD";
          battle = null;
        } else {
          battle.ballAnim = null;
          battle.log = `💨 ${eMon.name} ดิ้นหลุดออกจากลูกบอล! โจมตีให้เลือดลดลงอีกนิด!`;
          setTimeout(() => runEnemyTurn(), 900);
        }
      }, 1250);
    }

    function handleBattleVictory() {
      const pMon = party[battle.playerIdx];
      const eMon = battle.enemy;
      const expGain = eMon.level * 28;
      const goldGain = battle.isWild ? eMon.level * 18 : battle.npcRef.reward;

      gold += goldGain;
      pMon.exp += expGain;
      let evoMsg = "";

      if (pMon.exp >= pMon.nextExp) {
        pMon.level++;
        pMon.exp = 0;
        pMon.nextExp = pMon.level * 45;
        pMon.maxHp += 18;
        pMon.hp = pMon.maxHp;
        pMon.atk += 9;
        pMon.def += 8;

        // Check Evolution!
        const baseSpec = MONSTER_DEX.find(m => m.id === pMon.dexId);
        if (baseSpec && pMon.level >= baseSpec.evolveLv && baseSpec.evolveTo) {
          const nextSpec = MONSTER_DEX.find(m => m.id === baseSpec.evolveTo);
          if (nextSpec) {
            const oldName = pMon.name;
            pMon.dexId = nextSpec.id;
            pMon.name = nextSpec.name;
            pMon.icon = nextSpec.icon;
            pMon.color = nextSpec.color;
            pMon.maxHp += 35;
            pMon.hp = pMon.maxHp;
            pMon.atk += 18;
            discoveredDex.add(nextSpec.id);
            evoMsg = ` | 🌟 วิวัฒนาการ! ${oldName} แปลงร่างเป็น ${nextSpec.name}!`;
          }
        }
      }

      if (!battle.isWild && battle.npcRef) {
        if (!battle.npcRef.defeated) {
          battle.npcRef.defeated = true;
          badges++;
        }
      }

      pushToast(`🏆 ชนะการต่อสู้! +${goldGain}G, +${expGain} EXP${evoMsg}`, "#fbbf24");
      gameState = "OVERWORLD";
      battle = null;
    }

    // =========================================================================
    // 7. UNIFIED INPUT ENGINE (ZERO-BUG CLICK, TOUCH & KEYBOARD IN DISCORD)
    // =========================================================================
    const uiButtons = [];
    function registerButton(id, x, y, w, h, onClick) {
      uiButtons.push({ id, x, y, w, h, onClick });
    }

    function handleGlobalPointer(clientX, clientY) {
      const vx = (clientX - offsetX) / scaleX;
      const vy = (clientY - offsetY) / scaleX;

      // 1. Check Registered Canvas UI Buttons First
      for (let i = uiButtons.length - 1; i >= 0; i--) {
        const b = uiButtons[i];
        if (vx >= b.x && vx <= b.x + b.w && vy >= b.y && vy <= b.y + b.h) {
          b.onClick();
          return;
        }
      }

      // 2. If in Dialog, click anywhere to advance
      if (gameState === "DIALOG") {
        interactFacingTile();
        return;
      }

      // 3. If in Overworld, Click-to-Move on Map Tile
      if (gameState === "OVERWORLD") {
        const camX = Math.max(0, Math.min(MAP_COLS * TILE - V_WIDTH, player.px - V_WIDTH / 2 + TILE / 2));
        const camY = Math.max(0, Math.min(MAP_ROWS * TILE - V_HEIGHT, player.py - V_HEIGHT / 2 + TILE / 2));
        const worldClickX = vx + camX;
        const worldClickY = vy + camY;
        const targetCol = Math.floor(worldClickX / TILE);
        const targetRow = Math.floor(worldClickY / TILE);

        const dx = targetCol - player.x;
        const dy = targetRow - player.y;
        if (dx === 0 && dy === 0) {
          interactFacingTile();
        } else if (Math.abs(dx) >= Math.abs(dy)) {
          stepPlayer(dx > 0 ? "RIGHT" : "LEFT");
        } else {
          stepPlayer(dy > 0 ? "DOWN" : "UP");
        }
      }
    }

    window.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      handleGlobalPointer(e.clientX, e.clientY);
    }, { passive: false });

    const keysHeld = {};
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " ", "enter"].includes(k)) {
        e.preventDefault();
      }
      keysHeld[k] = true;

      if (k === " " || k === "enter" || k === "j") interactFacingTile();
      if (k === "escape" || k === "k") {
        if (["SHOP", "PARTY", "DEX"].includes(gameState)) gameState = "OVERWORLD";
      }
    }, { passive: false });

    window.addEventListener("keyup", (e) => {
      keysHeld[e.key.toLowerCase()] = false;
    });

    let moveCooldown = 0;
    function updateMovementTick() {
      if (moveCooldown > 0) { moveCooldown--; return; }
      if (gameState !== "OVERWORLD") return;

      if (keysHeld["w"] || keysHeld["arrowup"]) { stepPlayer("UP"); moveCooldown = 8; }
      else if (keysHeld["s"] || keysHeld["arrowdown"]) { stepPlayer("DOWN"); moveCooldown = 8; }
      else if (keysHeld["a"] || keysHeld["arrowleft"]) { stepPlayer("LEFT"); moveCooldown = 8; }
      else if (keysHeld["d"] || keysHeld["arrowright"]) { stepPlayer("RIGHT"); moveCooldown = 8; }
    }

    // =========================================================================
    // 8. PROCEDURAL PIXEL-STYLE GRAPHICS & UI RENDERING
    // =========================================================================
    function drawCharacter(x, y, shirtColor, hatColor, dir, frame, label) {
      const bob = frame === 1 ? -3 : 0;
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.beginPath();
      ctx.ellipse(x + 26, y + 44, 14, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Feet
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(x + 17, y + 34 + (frame ? 2 : 0), 7, 8);
      ctx.fillRect(x + 28, y + 34 + (!frame ? 2 : 0), 7, 8);

      // Body
      ctx.fillStyle = shirtColor;
      ctx.beginPath();
      ctx.roundRect(x + 14, y + 20 + bob, 24, 16, 6);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#fff";
      ctx.stroke();

      // Head
      ctx.fillStyle = "#fde68a";
      ctx.beginPath();
      ctx.arc(x + 26, y + 14 + bob, 11, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      if (dir !== "UP") {
        const ox = dir === "LEFT" ? -3 : (dir === "RIGHT" ? 3 : 0);
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(x + 21 + ox, y + 12 + bob, 3, 4);
        ctx.fillRect(x + 28 + ox, y + 12 + bob, 3, 4);
      }

      // Cap
      ctx.fillStyle = hatColor;
      ctx.beginPath();
      ctx.arc(x + 26, y + 10 + bob, 12, Math.PI, 0);
      ctx.fill();

      if (label) {
        ctx.font = "700 12px Kanit";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(0,0,0,0.75)";
        ctx.fillRect(x + 26 - 45, y - 16, 90, 18);
        ctx.fillStyle = "#fbbf24";
        ctx.fillText(label, x + 26, y - 4);
      }
    }

    function drawOverworld(camX, camY) {
      const startCol = Math.max(0, Math.floor(camX / TILE));
      const endCol = Math.min(MAP_COLS - 1, Math.ceil((camX + V_WIDTH) / TILE));
      const startRow = Math.max(0, Math.floor(camY / TILE));
      const endRow = Math.min(MAP_ROWS - 1, Math.ceil((camY + V_HEIGHT) / TILE));

      for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
          const sx = Math.round(c * TILE - camX);
          const sy = Math.round(r * TILE - camY);
          const t = worldMap[r][c];
          const even = (r + c) % 2 === 0;

          // Base Ground
          if (t === 0 || t === 1 || t === 3) ctx.fillStyle = even ? "#1b4332" : "#23533d";
          else if (t === 5 || t === 6 || t === 7 || t === 8 || t === 9 || t === 10) ctx.fillStyle = even ? "#475569" : "#52627a";
          else if (t === 4) ctx.fillStyle = even ? "#0284c7" : "#0369a1";
          else if (t === 15) ctx.fillStyle = "#92400e";
          else if (t === 11 || t === 12) ctx.fillStyle = even ? "#451a03" : "#572206";
          else if (t === 13 || t === 14) ctx.fillStyle = even ? "#0c4a6e" : "#075985";

          ctx.fillRect(sx, sy, TILE + 1, TILE + 1);

          // Decorations & Buildings
          if (t === 1) {
            ctx.fillStyle = "#10b981";
            ctx.fillRect(sx + 6, sy + 10, 12, 30);
            ctx.fillRect(sx + 22, sy + 6, 12, 34);
            ctx.fillRect(sx + 36, sy + 14, 10, 26);
          } else if (t === 12) {
            ctx.fillStyle = "#f97316";
            ctx.beginPath(); ctx.arc(sx + 26, sy + 26, 18, 0, Math.PI * 2); ctx.fill();
          } else if (t === 14) {
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath(); ctx.arc(sx + 26, sy + 26, 18, 0, Math.PI * 2); ctx.fill();
          } else if (t === 3) {
            ctx.fillStyle = "#064e3b";
            ctx.beginPath(); ctx.arc(sx + 26, sy + 24, 22, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#10b981";
            ctx.beginPath(); ctx.arc(sx + 26, sy + 18, 16, 0, Math.PI * 2); ctx.fill();
          } else if (t === 6) {
            ctx.fillStyle = "#e2e8f0";
            ctx.fillRect(sx + 2, sy, TILE - 4, TILE);
            ctx.fillStyle = "#334155";
            ctx.fillRect(sx + 14, sy + 12, 24, 18);
          } else if (t === 7 || t === 8 || t === 9) {
            ctx.fillStyle = t === 7 ? "#ef4444" : (t === 8 ? "#0284c7" : "#eab308");
            ctx.fillRect(sx, sy + 4, TILE, TILE - 4);
            ctx.font = "800 11px Kanit";
            ctx.fillStyle = "#fff";
            ctx.textAlign = "center";
            if (t === 7) ctx.fillText("POKÉCENTER", sx + 26, sy + 30);
            if (t === 8) ctx.fillText("POKÉMART", sx + 26, sy + 30);
            if (t === 9) ctx.fillText("GYM ARENA", sx + 26, sy + 30);
          } else if (t === 10) {
            ctx.fillStyle = "#1e293b";
            ctx.fillRect(sx + 10, sy + 6, 32, 46);
            ctx.fillStyle = "#38bdf8";
            ctx.fillRect(sx + 14, sy + 10, 24, 38);
          }
        }
      }

      // Draw NPCs
      for (const npc of NPCS) {
        const nx = Math.round(npc.x * TILE - camX);
        const ny = Math.round(npc.y * TILE - camY);
        drawCharacter(nx, ny, npc.color, npc.hat, "DOWN", 0, npc.name);
      }

      // Draw Companion Follower
      const lead = party[0];
      if (lead) {
        player.compPx += (player.prevX * TILE - player.compPx) * 0.25;
        player.compPy += (player.prevY * TILE - player.compPy) * 0.25;
        const cx = Math.round(player.compPx - camX);
        const cy = Math.round(player.compPy - camY);
        ctx.font = "30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(lead.icon, cx + 26, cy + 38);
      }

      // Draw Player
      player.px += (player.tx - player.px) * 0.35;
      player.py += (player.ty - player.py) * 0.35;
      drawCharacter(Math.round(player.px - camX), Math.round(player.py - camY), "#dc2626", "#ef4444", player.dir, player.frame, "YOU");
    }

    function drawBattleScene() {
      const pMon = party[battle.playerIdx];
      const eMon = battle.enemy;

      // Arena Backdrop
      const grad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
      grad.addColorStop(0, "#0f172a");
      grad.addColorStop(0.65, "#1e293b");
      grad.addColorStop(1, "#090d16");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      // Battle Platforms
      ctx.fillStyle = "rgba(56, 189, 248, 0.18)";
      ctx.beginPath(); ctx.ellipse(1120, 290, 170, 55, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(420, 470, 190, 60, 0, 0, Math.PI * 2); ctx.fill();

      // Enemy Status Box
      ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
      ctx.beginPath(); ctx.roundRect(140, 60, 430, 115, 14); ctx.fill();
      ctx.strokeStyle = "#475569"; ctx.lineWidth = 3; ctx.stroke();
      ctx.font = "800 22px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
      ctx.fillText(`${eMon.name}  Lv.${eMon.level} ${eMon.status ? '['+eMon.status+']' : ''}`, 165, 98);
      ctx.font = "600 14px Kanit"; ctx.fillStyle = "#38bdf8";
      ctx.fillText(`ธาตุ: ${eMon.type}`, 470, 98);
      // Enemy HP Bar
      ctx.fillStyle = "#1e293b"; ctx.fillRect(165, 118, 380, 18);
      ctx.fillStyle = "#10b981"; ctx.fillRect(165, 118, Math.max(0, (eMon.hp / eMon.maxHp) * 380), 18);
      ctx.font = "600 14px Kanit"; ctx.fillStyle = "#cbd5e1";
      ctx.fillText(`HP: ${eMon.hp} / ${eMon.maxHp}`, 165, 158);

      // Enemy Sprite or Pokeball Shake
      ctx.font = "110px sans-serif"; ctx.textAlign = "center";
      if (battle.ballAnim) {
        ctx.fillText("🔴", 1120 + Math.sin(Date.now() * 0.03) * 18, 260);
      } else {
        ctx.fillText(eMon.icon, 1120, 260 + Math.sin(Date.now() * 0.005) * 8);
      }

      // Player Sprite & Status Box
      ctx.font = "120px sans-serif";
      ctx.fillText(pMon.icon, 420, 440 + Math.sin(Date.now() * 0.006) * 6);

      ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
      ctx.beginPath(); ctx.roundRect(920, 350, 460, 130, 14); ctx.fill();
      ctx.strokeStyle = "#38bdf8"; ctx.stroke();
      ctx.font = "800 22px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
      ctx.fillText(`${pMon.name}  Lv.${pMon.level} ${pMon.status ? '['+pMon.status+']' : ''}`, 945, 388);
      ctx.fillStyle = "#1e293b"; ctx.fillRect(945, 405, 410, 18);
      ctx.fillStyle = "#10b981"; ctx.fillRect(945, 405, Math.max(0, (pMon.hp / pMon.maxHp) * 410), 18);
      ctx.font = "600 14px Kanit"; ctx.fillStyle = "#cbd5e1";
      ctx.fillText(`HP: ${pMon.hp}/${pMon.maxHp}   |   EXP: ${pMon.exp}/${pMon.nextExp}   |   ATK+${pMon.atkStage} DEF+${pMon.defStage}`, 945, 448);

      // Bottom Battle Console
      ctx.fillStyle = "#090d16";
      ctx.fillRect(0, 520, V_WIDTH, 230);
      ctx.strokeStyle = "#334155"; ctx.lineWidth = 4;
      ctx.strokeRect(0, 520, V_WIDTH, 230);

      // Battle Log Left Box
      ctx.fillStyle = "#111827";
      ctx.beginPath(); ctx.roundRect(30, 545, 680, 180, 12); ctx.fill();
      ctx.font = "700 20px Kanit"; ctx.fillStyle = "#f8fafc"; ctx.textAlign = "left";
      ctx.fillText(battle.log, 55, 635);

      // Right Command Buttons
      if (battle.menuTab === "MAIN") {
        const cmds = [
          { label: "⚔️ โจมตี (FIGHT)", x: 740, y: 545, c: "#dc2626", fn: () => battle.menuTab = "MOVES" },
          { label: "🎒 กระเป๋า & จับมอนสเตอร์", x: 1135, y: 545, c: "#d97706", fn: () => battle.menuTab = "BAG" },
          { label: "🐾 สลับมอนสเตอร์", x: 740, y: 645, c: "#2563eb", fn: () => battle.menuTab = "PARTY" },
          { label: "🏃 หนี (RUN)", x: 1135, y: 645, c: "#475569", fn: () => {
            if (!battle.isWild) { pushToast("🚫 หนีจากการดวลเทรนเนอร์ไม่ได้!", "#ef4444"); return; }
            gameState = "OVERWORLD"; battle = null;
          }}
        ];
        for (const b of cmds) {
          ctx.fillStyle = b.c;
          ctx.beginPath(); ctx.roundRect(b.x, b.y, 375, 80, 12); ctx.fill();
          ctx.font = "800 20px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
          ctx.fillText(b.label, b.x + 187, b.y + 48);
          registerButton("bcmd_" + b.label, b.x, b.y, 375, 80, b.fn);
        }
      } else if (battle.menuTab === "MOVES") {
        pMon.moves.forEach((mKey, idx) => {
          const mv = MOVES_DB[mKey];
          const bx = idx % 2 === 0 ? 740 : 1135;
          const by = idx < 2 ? 545 : 645;
          ctx.fillStyle = "#1e293b";
          ctx.beginPath(); ctx.roundRect(bx, by, 375, 80, 12); ctx.fill();
          ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 2; ctx.stroke();
          ctx.font = "700 18px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
          ctx.fillText(`${mv.name} [${mv.type}]`, bx + 18, by + 34);
          ctx.font = "500 13px Kanit"; ctx.fillStyle = "#94a3b8";
          ctx.fillText(mv.desc, bx + 18, by + 60);
          registerButton("mv_" + idx, bx, by, 375, 80, () => executePlayerMove(mKey));
        });
      } else if (battle.menuTab === "BAG") {
        const items = [
          { k: "ball1", name: `🔴 Spirit Ball (${inventory.ball1})`, x: 740, y: 545 },
          { k: "ball2", name: `🔵 Great Orb (${inventory.ball2})`, x: 1135, y: 545 },
          { k: "ball3", name: `🟣 Master Core (${inventory.ball3})`, x: 740, y: 645 },
          { k: "potion", name: `🧪 ยาฟื้นพลัง +65HP (${inventory.potion})`, x: 1135, y: 645 }
        ];
        items.forEach(it => {
          ctx.fillStyle = "#1e293b";
          ctx.beginPath(); ctx.roundRect(it.x, it.y, 375, 80, 12); ctx.fill();
          ctx.font = "700 18px Kanit"; ctx.fillStyle = "#fbbf24"; ctx.textAlign = "center";
          ctx.fillText(it.name, it.x + 187, it.y + 46);
          registerButton("bag_" + it.k, it.x, it.y, 375, 80, () => useBattleItem(it.k));
        });
      } else if (battle.menuTab === "PARTY") {
        party.slice(0, 4).forEach((mon, idx) => {
          const bx = idx % 2 === 0 ? 740 : 1135;
          const by = idx < 2 ? 545 : 645;
          ctx.fillStyle = "#1e293b";
          ctx.beginPath(); ctx.roundRect(bx, by, 375, 80, 12); ctx.fill();
          ctx.font = "700 18px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "left";
          ctx.fillText(`${mon.icon} ${mon.name} Lv.${mon.level} (${mon.hp}/${mon.maxHp} HP)`, bx + 20, by + 46);
          registerButton("sw_" + idx, bx, by, 375, 80, () => {
            if (mon.hp <= 0) { pushToast("❌ ตัวนี้หมดสติอยู่!", "#ef4444"); return; }
            battle.playerIdx = idx;
            battle.menuTab = "MAIN";
            battle.log = `🐾 ส่ง ${mon.name} ลงสนาม!`;
          });
        });
      }
    }

    function drawOverlayModal(title, renderContentFn) {
      ctx.fillStyle = "rgba(6, 9, 16, 0.92)";
      ctx.fillRect(90, 85, 1370, 610);
      ctx.strokeStyle = "#38bdf8"; ctx.lineWidth = 3;
      ctx.strokeRect(90, 85, 1370, 610);

      ctx.font = "800 26px Kanit"; ctx.fillStyle = "#fbbf24"; ctx.textAlign = "left";
      ctx.fillText(title, 130, 138);

      // Close Button
      ctx.fillStyle = "#ef4444";
      ctx.beginPath(); ctx.roundRect(1310, 102, 120, 44, 8); ctx.fill();
      ctx.font = "700 16px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
      ctx.fillText("✖ ปิดหน้าต่าง", 1370, 130);
      registerButton("close_modal", 1310, 102, 120, 44, () => gameState = "OVERWORLD");

      renderContentFn();
    }

    function drawPartyWindow() {
      drawOverlayModal("🐾 ทีมมอนสเตอร์ของคุณ (คลิกเพื่อตั้งเป็นตัวนำทีม / ฝึกฝน)", () => {
        party.forEach((mon, i) => {
          const x = 130 + (i % 3) * 430;
          const y = 175 + Math.floor(i / 3) * 230;
          ctx.fillStyle = i === 0 ? "#1e293b" : "#111827";
          ctx.beginPath(); ctx.roundRect(x, y, 400, 205, 14); ctx.fill();
          ctx.strokeStyle = i === 0 ? "#10b981" : "#334155"; ctx.stroke();

          ctx.font = "54px sans-serif"; ctx.textAlign = "left";
          ctx.fillText(mon.icon, x + 20, y + 70);
          ctx.font = "800 20px Kanit"; ctx.fillStyle = "#fff";
          ctx.fillText(`${mon.name} Lv.${mon.level}`, x + 95, y + 45);
          ctx.font = "600 14px Kanit"; ctx.fillStyle = "#38bdf8";
          ctx.fillText(`ธาตุ: ${mon.type} | HP: ${mon.hp}/${mon.maxHp} | ATK: ${mon.atk} DEF: ${mon.def}`, x + 95, y + 72);

          // Set Lead Button
          ctx.fillStyle = "#2563eb";
          ctx.beginPath(); ctx.roundRect(x + 20, y + 145, 170, 42, 8); ctx.fill();
          ctx.font = "700 14px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
          ctx.fillText(i === 0 ? "⭐ ตัวนำทีม" : "ตั้งเป็นตัวนำ", x + 105, y + 171);
          registerButton("lead_" + i, x + 20, y + 145, 170, 42, () => {
            const temp = party[0]; party[0] = party[i]; party[i] = temp;
            pushToast(`🐾 ตั้ง ${party[0].name} เป็นตัวนำทีมแล้ว!`);
          });

          // Train Level Up Button
          ctx.fillStyle = "#d97706";
          ctx.beginPath(); ctx.roundRect(x + 205, y + 145, 175, 42, 8); ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.fillText("🍒 ฝึกฝน (40G)", x + 292, y + 171);
          registerButton("train_" + i, x + 205, y + 145, 175, 42, () => {
            if (gold < 40) { pushToast("❌ Gold ไม่พอ (ต้องการ 40G)", "#ef4444"); return; }
            gold -= 40;
            mon.level++; mon.maxHp += 15; mon.hp = mon.maxHp; mon.atk += 8; mon.def += 6;
            pushToast(`⬆️ ${mon.name} เลเวลอัพเป็น Lv.${mon.level}!`, "#10b981");
          });
        });
      });
    }

    function drawShopWindow() {
      drawOverlayModal(`🛒 ร้านค้า PokéMart (เงินของคุณ: ${gold} Gold)`, () => {
        const goods = [
          { k: "ball1", name: "🔴 Spirit Ball", cost: 25, desc: "ลูกบอลมาตรฐานสำหรับจับมอนสเตอร์ป่า" },
          { k: "ball2", name: "🔵 Great Orb", cost: 65, desc: "โอกาสจับสำเร็จสูงกว่าปกติ 1.7 เท่า" },
          { k: "ball3", name: "🟣 Master Core", cost: 220, desc: "ลูกบอลในตำนาน จับมอนสเตอร์ติด 100%" },
          { k: "potion", name: "🧪 Hyper Potion", cost: 30, desc: "ฟื้นฟู +65 HP และรักษาสถานะผิดปกติ" }
        ];
        goods.forEach((g, i) => {
          const x = 130 + (i % 2) * 640;
          const y = 185 + Math.floor(i / 2) * 210;
          ctx.fillStyle = "#161f33";
          ctx.beginPath(); ctx.roundRect(x, y, 600, 180, 14); ctx.fill();
          ctx.font = "800 22px Kanit"; ctx.fillStyle = "#fbbf24"; ctx.textAlign = "left";
          ctx.fillText(`${g.name}  —  ราคา ${g.cost} Gold`, x + 28, y + 52);
          ctx.font = "500 16px Kanit"; ctx.fillStyle = "#cbd5e1";
          ctx.fillText(g.desc, x + 28, y + 90);

          ctx.fillStyle = "#10b981";
          ctx.beginPath(); ctx.roundRect(x + 28, y + 115, 200, 44, 8); ctx.fill();
          ctx.font = "700 16px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
          ctx.fillText("🛒 ซื้อไอเทม 1 ชิ้น", x + 128, y + 143);
          registerButton("buy_" + g.k, x + 28, y + 115, 200, 44, () => {
            if (gold < g.cost) { pushToast("❌ Gold ไม่พอ!", "#ef4444"); return; }
            gold -= g.cost; inventory[g.k]++;
            pushToast(`✅ ซื้อ ${g.name} สำเร็จ!`, "#10b981");
          });
        });
      });
    }

    function drawDexWindow() {
      drawOverlayModal(`📖 สมุดภาพมอนสเตอร์ (ค้นพบแล้ว ${discoveredDex.size} / ${MONSTER_DEX.length} สายพันธุ์)`, () => {
        MONSTER_DEX.forEach((m, i) => {
          const has = discoveredDex.has(m.id);
          const x = 130 + (i % 3) * 430;
          const y = 175 + Math.floor(i / 3) * 155;
          ctx.fillStyle = has ? "#17253b" : "#0f1420";
          ctx.beginPath(); ctx.roundRect(x, y, 400, 135, 12); ctx.fill();
          ctx.font = "46px sans-serif"; ctx.textAlign = "left";
          ctx.fillText(has ? m.icon : "❓", x + 20, y + 80);
          ctx.font = "800 19px Kanit"; ctx.fillStyle = has ? "#fff" : "#64748b";
          ctx.fillText(`#0${m.id}  ${has ? m.name : "???"}`, x + 90, y + 50);
          ctx.font = "500 14px Kanit"; ctx.fillStyle = "#38bdf8";
          ctx.fillText(has ? `ธาตุ: ${m.type} | Base HP: ${m.hp} ATK: ${m.atk}` : "ยังไม่ได้ค้นพบในธรรมชาติ", x + 90, y + 82);
        });
      });
    }

    // =========================================================================
    // 9. MASTER GAME LOOP
    // =========================================================================
    function gameLoop() {
      updateMovementTick();
      uiButtons.length = 0;

      ctx.save();
      ctx.fillStyle = "#06080e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.translate(offsetX, offsetY);
      ctx.scale(scaleX, scaleX);

      if (gameState === "BATTLE" && battle) {
        drawBattleScene();
      } else {
        const camX = Math.max(0, Math.min(MAP_COLS * TILE - V_WIDTH, player.px - V_WIDTH / 2 + TILE / 2));
        const camY = Math.max(0, Math.min(MAP_ROWS * TILE - V_HEIGHT, player.py - V_HEIGHT / 2 + TILE / 2));
        drawOverworld(camX, camY);
        drawHUD();

        if (gameState === "DIALOG") drawDialogModal();
        if (gameState === "PARTY") drawPartyWindow();
        if (gameState === "SHOP") drawShopWindow();
        if (gameState === "DEX") drawDexWindow();
      }

      // Draw Toast Alerts
      for (let i = toasts.length - 1; i >= 0; i--) {
        const t = toasts[i];
        t.timer--;
        ctx.fillStyle = "rgba(15, 23, 42, 0.95)";
        ctx.beginPath(); ctx.roundRect(V_WIDTH / 2 - 260, 85 + i * 50, 520, 42, 10); ctx.fill();
        ctx.strokeStyle = t.color; ctx.lineWidth = 2; ctx.stroke();
        ctx.font = "700 16px Kanit"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
        ctx.fillText(t.text, V_WIDTH / 2, 112 + i * 50);
        if (t.timer <= 0) toasts.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
